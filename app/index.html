<!doctype html>
<html lang="uk" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf8f3" />
  <meta name="color-scheme" content="light dark" />
  <title>Lesefreund — німецькі книжки з перекладом</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="brand.png" />
  <link rel="preload" href="fonts/literata-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // тема до завантаження стилів — без «спалаху» світлого екрана
    try { var s = JSON.parse(localStorage.getItem('lesefreund:v2') || '{}'); if (s.theme) document.documentElement.dataset.theme = s.theme; } catch (e) {}
  </script>
</head>
<body>
  <main id="view"></main>
  <nav id="tabbar" hidden></nav>
  <div id="selbar" role="toolbar"></div>
  <div id="backdrop"></div>
  <div id="sheet" role="dialog" aria-modal="true"></div>
  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
