<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LazyGame</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg-top:#21173f; --bg-bot:#0c0a18; --panel:#2e2846; --panel2:#3a3256;
    --stroke:#5c4f86; --text:#edebf7; --muted:#a8a2c4;
    --violet:#8e70ff; --gold:#ffce61; --pink:#ff6392; --green:#56d6a0;
    --cyan:#4ecee8; --red:#f06e6e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text); background:linear-gradient(160deg,var(--bg-top),var(--bg-bot) 70%);
    min-height:100vh; padding:16px 16px 40px;
  }
  .head{display:flex; align-items:center; gap:14px; margin:8px 2px 20px;}
  .mono{
    width:60px; height:60px; border-radius:16px; background:var(--violet);
    display:flex; align-items:center; justify-content:center; color:#17122a;
    font-weight:800; font-size:26px; flex:0 0 auto;
  }
  .head h1{margin:0; font-size:26px; letter-spacing:.3px;}
  .head p{margin:2px 0 0; color:var(--muted); font-size:13px;}
  .grid{display:flex; flex-direction:column; gap:12px;}
  .card{
    position:relative; background:var(--panel); border:1px solid transparent;
    border-radius:18px; padding:16px 16px 16px 20px; cursor:pointer;
    transition:transform .08s ease, border-color .15s ease, background .15s ease;
    overflow:hidden;
  }
  .card:active{transform:scale(.99);}
  .card.sel{border-color:var(--c); background:var(--panel2);}
  .card .bar{position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--c);}
  .card h3{margin:0 0 4px; font-size:19px; display:flex; align-items:center; gap:8px;}
  .dot{width:12px; height:12px; border-radius:50%; background:var(--c); flex:0 0 auto;}
  .card .desc{color:var(--muted); font-size:14px; margin:0;}
  .tag{
    position:absolute; right:14px; top:14px; font-size:11px; font-weight:700;
    padding:3px 9px; border-radius:999px; background:rgba(255,255,255,.08); color:var(--muted);
  }
  .rules{
    margin-top:10px; font-size:13px; color:var(--text); background:rgba(0,0,0,.18);
    border-radius:12px; padding:10px 12px; display:none; line-height:1.45;
  }
  .card.sel .rules{display:block;}
  .playbtn{
    display:none; width:100%; margin-top:22px; padding:16px; border:none; cursor:pointer;
    border-radius:16px; background:var(--gold); color:#17122a; font-size:17px; font-weight:800;
  }
  .hint{margin:18px 2px 0; color:var(--muted); font-size:12px; text-align:center;}
</style>
</head>
<body>
  <div class="head">
    <div class="mono">LG</div>
    <div>
      <h1>LazyGame</h1>
      <p>Выбери игру и запусти её в чате</p>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <button class="playbtn" id="playbtn"></button>
  <p class="hint" id="hint"></p>

<script>
const GAMES = [
  {slug:"crocodile", name:"Крокодил", type:"group", color:"var(--green)",
   desc:"Объясняй слово, не называя его", rules:"Ведущему приходит слово — он объясняет его словами и эмодзи, остальные угадывают в чате. Угадал — стал ведущим."},
  {slug:"bunker", name:"Бункер", type:"group", color:"var(--gold)",
   desc:"Переживи катастрофу", rules:"Случилась катастрофа, мест в бункере мало. У каждого карточка персонажа — раскрывайте характеристики и голосуйте, кого оставить снаружи."},
  {slug:"mafia", name:"Мафия", type:"group", color:"var(--red)",
   desc:"Найди мафию в городе", rules:"Роли: мафия, доктор, комиссар, мирные. Ночью мафия убивает, доктор лечит, комиссар проверяет. Днём город голосует."},
  {slug:"hangman", name:"Виселица", type:"both", color:"var(--cyan)",
   desc:"Угадай слово по буквам", rules:"Бот загадывает слово, вы называете буквы. За ошибку достраивается виселица. Можно играть соло в личке или компанией."},
  {slug:"truthdare", name:"Правда или Действие", type:"group", color:"var(--pink)",
   desc:"Выбери и выполни", rules:"Бот выбирает игрока, тот жмёт «Правда» или «Действие» и получает задание. Ход передаётся дальше."},
  {slug:"quiz", name:"Викторина", type:"solo", color:"var(--violet)",
   desc:"Проверь эрудицию соло", rules:"7 вопросов с вариантами ответов. Отвечай кнопками и набирай очки. Играется в личке с ботом."},
  {slug:"guessnum", name:"Угадай число", type:"solo", color:"var(--green)",
   desc:"1–100 за 7 попыток", rules:"Бот загадывает число от 1 до 100. Угадай его за 7 попыток — бот подсказывает «больше/меньше»."},
  {slug:"rps", name:"Камень-ножницы-бумага", type:"solo", color:"var(--gold)",
   desc:"Дуэль с ботом до 3 побед", rules:"Классика против бота. Жми камень, ножницы или бумагу. Кто первым наберёт 3 победы — тот и выиграл."},
];
const TAGS = {group:"👥 компания", solo:"🙂 соло", both:"👥/🙂"};

const tg = window.Telegram ? window.Telegram.WebApp : null;
if(tg){ tg.ready(); tg.expand(); }

let selected = null;
const grid = document.getElementById("grid");
const playbtn = document.getElementById("playbtn");
const hint = document.getElementById("hint");

GAMES.forEach(g=>{
  const el = document.createElement("div");
  el.className = "card"; el.style.setProperty("--c", g.color);
  el.innerHTML = `
    <div class="bar"></div>
    <span class="tag">${TAGS[g.type]}</span>
    <h3><span class="dot"></span>${g.name}</h3>
    <p class="desc">${g.desc}</p>
    <div class="rules">${g.rules}</div>`;
  el.onclick = ()=>select(g, el);
  grid.appendChild(el);
});

function select(g, el){
  selected = g;
  document.querySelectorAll(".card").forEach(c=>c.classList.remove("sel"));
  el.classList.add("sel");
  const label = "▶️ Играть: " + g.name;
  if(tg && tg.MainButton){
    tg.MainButton.setText(label); tg.MainButton.show();
    tg.MainButton.offClick(play); tg.MainButton.onClick(play);
  }else{
    playbtn.textContent = label; playbtn.style.display = "block";
  }
}

function play(){
  if(!selected) return;
  const payload = JSON.stringify({game:selected.slug});
  if(tg && tg.sendData){ tg.sendData(payload); tg.close(); }
  else{ hint.textContent = "Открой мини-апп из Telegram, чтобы запустить игру."; }
}
playbtn.onclick = play;

if(!tg){
  hint.textContent = "Это мини-приложение Telegram. Открой его через кнопку в боте LazyGame.";
}
</script>
</body>
</html>
